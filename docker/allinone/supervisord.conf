; ad-manager all-in-one: the DC, the queue, the panel and the agent, logs on the container's stdout (docker logs)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; supervisorctl status | restart panel …
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:samba]
command=/usr/sbin/samba -i --debug-stdout -d 1
priority=10
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true   ; smbd, winbindd and the rest stop with it
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --dir /var/lib/redis
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:panel]
command=/opt/ad-manager/ad-manager server --config /opt/ad-manager/config.toml
user=ad-manager
environment=HOME="/opt/ad-manager/data"
priority=20
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=/opt/ad-manager/ad-manager agent --config /opt/ad-manager/config.toml
priority=30
startsecs=3
autorestart=true
stopwaitsecs=40    ; the sync worker has 20 s to stop cleanly
stopasgroup=true   ; a sync worker never outlives its agent (it would write without the agent's locks)
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
