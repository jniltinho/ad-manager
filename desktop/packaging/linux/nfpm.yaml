# .deb and .rpm of the Wails desktop (preview): nfpm package --config packaging/linux/nfpm.yaml --packager deb|rpm,
# with VERSION set (make packages). The runtime needs GTK4 and WebKitGTK 6.0.
name: ad-manager-desktop
arch: amd64
platform: linux
version: ${VERSION}
version_schema: none
maintainer: Nilton OS <jniltinho@gmail.com>
description: |
  AD Manager desktop app (preview on Wails v3): the web panel's own pages in the system's webview, signed in to
  an AD Manager panel with its certificate pinned.
homepage: https://github.com/jniltinho/ad-manager
license: MIT
section: admin
contents:
  - src: bin/linux/ad-manager-desktop
    dst: /usr/bin/ad-manager-desktop
    file_info:
      mode: 0755
  - src: packaging/linux/ad-manager-desktop.desktop
    dst: /usr/share/applications/ad-manager-desktop.desktop
    file_info:
      mode: 0644
  - src: packaging/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/ad-manager-desktop.png
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
