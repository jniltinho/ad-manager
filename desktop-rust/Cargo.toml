[workspace]
members = [
    "apps/ad-manager-desktop-rs",
    "crates/core",
    "crates/platform",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/platform-macos",
    "crates/ui",
]
# Vendored third-party crates keep their own lints; see vendor/README.md.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/jniltinho/ad-manager"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# internal
adm-core = { path = "crates/core" }
adm-platform = { path = "crates/platform" }
adm-platform-linux = { path = "crates/platform-linux" }
adm-platform-windows = { path = "crates/platform-windows" }
adm-platform-macos = { path = "crates/platform-macos" }
adm-ui = { path = "crates/ui" }

# wgpu everywhere; the glow renderer is added only on macOS (the Metal fallback, apps/ad-manager-desktop-rs).
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "svg"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "cookies", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros", "signal"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
x509-parser = "=0.18.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
toml = "=1.1.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
regex = "=1.13.1"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
dirs = "=7.0.0"
thiserror = "=2.0.21"
getrandom = "=0.4.3"
url = "2.5.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rcgen = "0.14"
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot", "eframe"] }
secrecy = "=0.10.3"
resvg = { version = "=0.45.1", default-features = false }
zeroize = "=1.9.1"

[patch.crates-io]
# wgpu-hal 30.0.1 + DX12 keeps the display-owning WARP adapter (GPU-less Windows VMs; vendor/README.md).
wgpu-hal = { path = "vendor/wgpu-hal" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
