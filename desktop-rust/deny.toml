# cargo-deny 0.20.2 (pinned in .github/workflows/desktop-rust-ci.yml): `scripts/cargo-docker.sh target/tools/cargo-deny check`.
# Release targets: Linux, Windows and macOS (universal).
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
# The RustSec database is fetched at check time (network in CI only).
yanked = "deny"
ignore = [
    # zvariant, zvariant_derive, zbus_names: informational "unmaintained" notices (2026-10-19), no vulnerability;
    # their code moved into zbus 6. They come with zbus 5 through rfd's XDG portal (the Linux file dialogs). Drop
    # these when rfd/ashpd move to zbus 6 (rustXterm ignores the same three).
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; pulled by zbus 5 via rfd's xdg portal; no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; pulled by zbus 5 via rfd's xdg portal; no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; pulled by zbus 5 via rfd's xdg portal; no vulnerability" },
]

[licenses]
# Permissive licenses found in the dependency graph (`cargo deny list`). No copyleft (GPL/LGPL);
# dual-licensed crates (e.g. self_cell, r-efi) are accepted through their permissive alternative.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    # clipboard-win and error-code (arboard on Windows).
    "BSL-1.0",
    # egui's bundled default fonts (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are publish = false path dependencies.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
