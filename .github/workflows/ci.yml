# CI: every push to main and every pull request — the server (Go and frontend tests on Linux) and the desktop app
# (desktop-ci.yml: checks, Windows and macOS builds, the native Windows WARP test), together. The release
# (release.yml) calls this workflow first. The themes' visual regression is not run here (scripts/visual-ci.sh,
# locally). The Fyne app in archive/desktop-go/ is archived and no longer built or tested.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  TZ: America/Sao_Paulo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go vet and tests
        run: |
          go vet ./...
          go test -race ./... -count=1
          (cd third_party/go-msrpc && go test ./dcerpc -run 'TestBodyComplete' -count=1)
      - name: Frontend check and tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test

  desktop:
    uses: ./.github/workflows/desktop-ci.yml
