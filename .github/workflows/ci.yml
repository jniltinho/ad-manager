# CI: every push to main and every pull request — the server (Go and frontend tests on Linux) and the desktop app
# (desktop-ci.yml: checks, Linux/Windows/macOS builds and native smokes), together. The release (release.yml) calls
# this workflow first. The themes' visual regression is not run here (scripts/visual-ci.sh, locally). The Fyne and
# Rust desktop apps in archive/ are archived and no longer built or tested.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  TZ: America/Sao_Paulo

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go vet and tests
        run: |
          go vet ./...
          go test -race ./... -count=1
          (cd third_party/go-msrpc && go test ./dcerpc -run 'TestBodyComplete' -count=1)
      - name: Frontend check and tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test

  desktop:
    uses: ./.github/workflows/desktop-ci.yml
