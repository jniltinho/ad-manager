# Release on a tag vX.Y.Z, the server and the desktop app together: the CI (ci.yml, both) runs first; then the Linux
# job builds the SPA, the server for linux (amd64) and the .deb, the desktop jobs build the desktop app (desktop/, Go +
# Wails, with the tag's version) for Linux (an AppImage and the bare binary's .tar.gz) and Windows in its toolchain image and for macOS
# natively as a universal (Apple Silicon + Intel) .app, ad-hoc signed; the last job publishes everything in one release
# with the gh CLI, with the notes of that version in CHANGELOG.md and one checksums.txt. The Fyne and Rust desktop
# apps in archive/ are archived.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo
  APP: ad-manager

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: The tag's version (the desktop app's too, given to its build)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: SPA (→ web/dist)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Server (linux) and .deb
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="ad-manager/internal/buildinfo"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildTime=${BUILDTIME}"
          mkdir -p dist build
          # the server for linux only (the .deb and the tarball)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "build/${APP}" .
          upx -q --best --lzma "build/${APP}"
          cp README.md build/
          cp config.toml.example build/config.toml
          tar -C build -czf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" "${APP}" config.toml README.md
          rm -f "build/${APP}"
          # .deb (nfpm) with the already-compressed linux binary
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          tar -xzf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" -C build "${APP}"
          cp "build/${APP}" dist/ad-manager # nfpm packages dist/ad-manager
          VERSION="${VERSION#v}" "$(go env GOPATH)/bin/nfpm" pkg --packager deb --config packaging/nfpm.yaml --target dist/
          rm -f dist/ad-manager "build/${APP}"
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  desktop-linux-windows:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux x86_64 (AppImage, tar.gz) and Windows x86_64 (zip), in the toolchain image
        run: make -C desktop dist DIST=dist VERSION="v$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-windows
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.zip
          if-no-files-found: error

  desktop-macos:
    needs: [ci, version]
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The SPA in desktop mode (embedded)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build:desktop
      - name: Build both slices and fuse them (lipo)
        run: |
          for arch in arm64 amd64; do
            GOARCH=$arch go build -tags production -trimpath -ldflags "-s -w -X main.version=v$VERSION" -o "bin/darwin-$arch" .
          done
          lipo -create -output bin/ad-manager-desktop bin/darwin-arm64 bin/darwin-amd64
          lipo -info bin/ad-manager-desktop
      - name: Bundle the .app (universal, ad-hoc signed) and zip it
        run: sh packaging/macos/bundle.sh bin/ad-manager-desktop "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: desktop/dist/*.zip
          if-no-files-found: error

  publish:
    needs: [linux, desktop-linux-windows, desktop-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
          # the notes: this version's section of CHANGELOG.md
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${TAG}." > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Packages:** server for `linux/amd64` (`.tar.gz`, and `.deb` for Ubuntu 26.04); desktop app for Linux
          (an AppImage with GTK4 and WebKitGTK 6.0 inside, or the bare binary's `.tar.gz`, which needs
          them from the system), Windows (it needs WebView2) and macOS (a
          universal `.app`, Apple Silicon and Intel); `checksums.txt`. The Windows zip and the
          macOS .app are unsigned (macOS: ad-hoc): verify the download against checksums.txt first; on macOS open the
          app with right-click → Open the first time.
          NOTES
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
