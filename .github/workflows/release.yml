# Release on a tag vX.Y.Z: the CI (ci.yml) runs first; then the Linux job builds the SPA, the server for linux (amd64)
# and the .deb, and the last job publishes them with the gh CLI, with the notes of that version in CHANGELOG.md and
# checksums.txt. The desktop app (Rust) has its own release (desktop-rust-release.yml, tags desktop-rust-v*); the Fyne
# app in desktop/ is archived and no longer released.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo
  APP: ad-manager

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: SPA (→ web/dist)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Server (linux) and .deb
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="ad-manager/internal/buildinfo"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildTime=${BUILDTIME}"
          mkdir -p dist build
          # the server for linux only (the .deb and the tarball)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "build/${APP}" .
          upx -q --best --lzma "build/${APP}"
          cp README.md build/
          cp config.toml.example build/config.toml
          tar -C build -czf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" "${APP}" config.toml README.md
          rm -f "build/${APP}"
          # .deb (nfpm) with the already-compressed linux binary
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          tar -xzf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" -C build "${APP}"
          cp "build/${APP}" dist/ad-manager # nfpm packages dist/ad-manager
          VERSION="${VERSION#v}" "$(go env GOPATH)/bin/nfpm" pkg --packager deb --config packaging/nfpm.yaml --target dist/
          rm -f dist/ad-manager "build/${APP}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
          # the notes: this version's section of CHANGELOG.md
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${TAG}." > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Packages:** server for `linux/amd64` (`.tar.gz`, and `.deb` for Ubuntu 26.04); `checksums.txt`. The desktop
          app (Linux, Windows, macOS) is released on its own `desktop-rust-v*` tags.
          NOTES
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
