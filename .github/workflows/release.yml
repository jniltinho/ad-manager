# Release on a tag vX.Y.Z, the server and the desktop app together: the CI (ci.yml, both) runs first and the desktop's
# version (desktop/Cargo.toml) must be X.Y.Z; then the Linux job builds the SPA, the server for linux (amd64) and
# the .deb, the desktop jobs build Linux and Windows in the pinned toolchain images and macOS natively as a universal
# (Apple Silicon + Intel) .app, ad-hoc signed; the last job publishes everything in one release with the gh CLI, with
# the notes of that version in CHANGELOG.md and one checksums.txt. The Fyne app in archive/desktop-go/ is archived.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo
  APP: ad-manager
  TOOLCHAIN_IMAGE: docker.io/jniltinho/rustxterm-toolchain:snapshot-20261001@sha256:6872535a844a568c5fe8bf05c52c7a0adfa2370fce8990be511ff056ffdb9c70
  WINDOWS_IMAGE: docker.io/jniltinho/rustxterm-windows-toolchain:snapshot-20261001@sha256:7b9892dc2cc56819f4ee1002a2eb7381b31cebcff9166716b02e9cbd2ebbb5e0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The desktop's version is the tag's
        id: v
        run: |
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n 1)
          version=${GITHUB_REF_NAME#v}
          if [ "$version" != "$workspace" ]; then
            echo "tag $GITHUB_REF_NAME: desktop/Cargo.toml has $workspace (set it to $version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: SPA (→ web/dist)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Server (linux) and .deb
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="ad-manager/internal/buildinfo"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildTime=${BUILDTIME}"
          mkdir -p dist build
          # the server for linux only (the .deb and the tarball)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "build/${APP}" .
          upx -q --best --lzma "build/${APP}"
          cp README.md build/
          cp config.toml.example build/config.toml
          tar -C build -czf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" "${APP}" config.toml README.md
          rm -f "build/${APP}"
          # .deb (nfpm) with the already-compressed linux binary
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          tar -xzf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" -C build "${APP}"
          cp "build/${APP}" dist/ad-manager # nfpm packages dist/ad-manager
          VERSION="${VERSION#v}" "$(go env GOPATH)/bin/nfpm" pkg --packager deb --config packaging/nfpm.yaml --target dist/
          rm -f dist/ad-manager "build/${APP}"
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  desktop-linux-windows:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain images (pinned by digest)
        run: |
          docker pull -q "$TOOLCHAIN_IMAGE" && docker tag "$TOOLCHAIN_IMAGE" rustxterm-toolchain:dev
          docker pull -q "$WINDOWS_IMAGE" && docker tag "$WINDOWS_IMAGE" rustxterm-windows-toolchain:dev
      - name: Build Linux x86_64 and Windows x86_64
        run: |
          scripts/cargo-docker.sh cargo build --release --locked -p ad-manager-desktop
          DESKTOP_RUST_TOOLCHAIN=windows scripts/cargo-docker.sh cargo build --release --locked -p ad-manager-desktop --target x86_64-pc-windows-gnu
      - name: Archives
        run: |
          mkdir -p dist/linux dist/windows
          cp target/docker/release/ad-manager-desktop README.md CHANGELOG.md dist/linux/
          cp target/docker/x86_64-pc-windows-gnu/release/ad-manager-desktop.exe README.md CHANGELOG.md dist/windows/
          tar -C dist/linux -czf "dist/ad-manager-desktop_${VERSION}_linux_x86_64.tar.gz" .
          (cd dist/windows && zip -q -r "../ad-manager-desktop_${VERSION}_windows_x86_64.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-windows
          path: |
            desktop/dist/*.tar.gz
            desktop/dist/*.zip
          if-no-files-found: error

  desktop-macos:
    needs: [ci, version]
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Build both slices and fuse them (lipo)
        run: |
          cargo build --release --locked -p ad-manager-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p ad-manager-desktop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ad-manager-desktop \
            target/aarch64-apple-darwin/release/ad-manager-desktop \
            target/x86_64-apple-darwin/release/ad-manager-desktop
          lipo -info dist/ad-manager-desktop
      - name: Bundle the .app (universal, ad-hoc signed) and zip it
        run: sh packaging/macos/bundle.sh dist/ad-manager-desktop "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: desktop/dist/*.zip
          if-no-files-found: error

  publish:
    needs: [linux, desktop-linux-windows, desktop-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
          # the notes: this version's section of CHANGELOG.md
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${TAG}." > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Packages:** server for `linux/amd64` (`.tar.gz`, and `.deb` for Ubuntu 26.04); desktop app for Linux,
          Windows and macOS (a universal `.app`, Apple Silicon and Intel); `checksums.txt`. The Windows zip and the
          macOS .app are unsigned (macOS: ad-hoc): verify the download against checksums.txt first; on macOS open the
          app with right-click → Open the first time.
          NOTES
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
