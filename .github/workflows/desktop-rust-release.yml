# Release of the Rust desktop (desktop-rust/) on a tag desktop-rust-vX.Y.Z (the version of desktop-rust/Cargo.toml).
# release.yml (tags v*) does not match these tags and is never called from here. Its CI runs first; then Linux and
# Windows are built in the pinned toolchain images and macOS natively as a universal (Apple Silicon + Intel) .app,
# ad-hoc signed; the release gets the three archives, SHA256SUMS and the notes of that version in
# desktop-rust/CHANGELOG.md.
name: desktop-rust-release

on:
  push:
    tags: ["desktop-rust-v*"]
  # Dry run on any branch: every build, nothing published.
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_IMAGE: docker.io/jniltinho/rustxterm-toolchain:snapshot-20261001@sha256:6872535a844a568c5fe8bf05c52c7a0adfa2370fce8990be511ff056ffdb9c70
  WINDOWS_IMAGE: docker.io/jniltinho/rustxterm-windows-toolchain:snapshot-20261001@sha256:7b9892dc2cc56819f4ee1002a2eb7381b31cebcff9166716b02e9cbd2ebbb5e0

jobs:
  ci:
    uses: ./.github/workflows/desktop-rust-ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the workspace version
        id: v
        run: |
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop-rust/Cargo.toml | head -n 1)
          version=${GITHUB_REF_NAME#desktop-rust-v}
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && version=$workspace
          if [ "$version" != "$workspace" ]; then
            echo "tag $GITHUB_REF_NAME does not match desktop-rust version $workspace" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-windows:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop-rust
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain images (pinned by digest)
        run: |
          docker pull -q "$TOOLCHAIN_IMAGE" && docker tag "$TOOLCHAIN_IMAGE" rustxterm-toolchain:dev
          docker pull -q "$WINDOWS_IMAGE" && docker tag "$WINDOWS_IMAGE" rustxterm-windows-toolchain:dev
      - name: Build Linux x86_64 and Windows x86_64
        run: |
          scripts/cargo-docker.sh cargo build --release --locked -p ad-manager-desktop-rs
          DESKTOP_RUST_TOOLCHAIN=windows scripts/cargo-docker.sh cargo build --release --locked -p ad-manager-desktop-rs --target x86_64-pc-windows-gnu
      - name: Archives
        run: |
          mkdir -p dist/linux dist/windows
          cp target/docker/release/ad-manager-desktop-rs README.md CHANGELOG.md dist/linux/
          cp target/docker/x86_64-pc-windows-gnu/release/ad-manager-desktop-rs.exe README.md CHANGELOG.md dist/windows/
          tar -C dist/linux -czf "dist/ad-manager-desktop-rs_${VERSION}_linux_x86_64.tar.gz" .
          (cd dist/windows && zip -q -r "../ad-manager-desktop-rs_${VERSION}_windows_x86_64.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-windows
          path: |
            desktop-rust/dist/*.tar.gz
            desktop-rust/dist/*.zip
          if-no-files-found: error

  macos:
    needs: [ci, version]
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-rust
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Build both slices and fuse them (lipo)
        run: |
          cargo build --release --locked -p ad-manager-desktop-rs --target aarch64-apple-darwin
          cargo build --release --locked -p ad-manager-desktop-rs --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ad-manager-desktop-rs \
            target/aarch64-apple-darwin/release/ad-manager-desktop-rs \
            target/x86_64-apple-darwin/release/ad-manager-desktop-rs
          lipo -info dist/ad-manager-desktop-rs
      - name: Bundle the .app (universal, ad-hoc signed) and zip it
        run: sh packaging/macos/bundle.sh dist/ad-manager-desktop-rs "$VERSION" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: desktop-rust/dist/*.zip
          if-no-files-found: error

  publish:
    needs: [version, linux-windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and the notes of this version
        run: |
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS && cd ..
          awk -v v="$VERSION" '$0 ~ "^## \\[?" v "\\]?( |$)" {p=1; next} /^## / && p {exit} p' desktop-rust/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no section for $VERSION in desktop-rust/CHANGELOG.md" >&2; exit 1; }
          {
            echo
            echo "The Windows zip and the macOS .app are unsigned (macOS: ad-hoc): verify the download against SHA256SUMS first; on macOS open the app with right-click → Open the first time."
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest=false --title "AD Manager desktop (Rust) $VERSION" --notes-file notes.md
