# CI of the desktop app (desktop/: Go, Wails v3, the web SPA in desktop mode), called by ci.yml (every pull request and
# push to main, with the server's checks) and so by release.yml. Linux runs the checks and builds in the toolchain
# image and a native smoke of the real window against the all-in-one test image (a fictitious domain.local, a random
# password); Windows and macOS build natively and run the smoke without a panel (the webview bridge and a binding).
# Nothing is uploaded unless a job fails: release.yml publishes every artifact of its run.
name: desktop-ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_PANEL_IMAGE: docker.io/jniltinho/ad-manager:0.26.1@sha256:1be3a482f81c9e8066da440549b4cca1bc3a217179c6765324af4d266fea938e

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Checks (gofmt, go vet, go test, the web build without the desktop's code)
        run: make -C desktop check
      - name: Linux and Windows builds, .deb and .rpm
        run: make -C desktop dist DIST=dist
      - name: Test panel (all-in-one image, domain.local, random password in a 0600 file)
        run: |
          install -d -m 700 "$RUNNER_TEMP/live"
          (umask 077; openssl rand -base64 18 | tr -d '/+=' | sed 's/^/Aa1!/' > "$RUNNER_TEMP/live/password")
          AD_ADMIN_PASSWORD="$(cat "$RUNNER_TEMP/live/password")" docker run -d --name panel --hostname dc1 --cap-add SYS_ADMIN \
            -p 127.0.0.1:18443:8443 -e AD_DOMAIN=domain.local -e AD_ADMIN_PASSWORD "$TEST_PANEL_IMAGE" >/dev/null
          for i in $(seq 1 120); do curl -ksf https://127.0.0.1:18443/api/health >/dev/null && break; sleep 2; done
          curl -ksf https://127.0.0.1:18443/api/health >/dev/null
      - name: Runtime of the native smoke (GTK4, WebKitGTK 6.0, Xvfb, xdotool)
        run: |
          # WebKitGTK's bubblewrap sandbox needs unprivileged user namespaces, which this runner's AppArmor blocks
          # (an Ubuntu desktop allows them to bwrap through its profile): this throwaway VM allows them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-4-1 libwebkitgtk-6.0-4 xvfb xauth dbus-x11 xdotool imagemagick
      - name: Native smoke (first run through Configure, then the checks of the smoke build)
        working-directory: desktop
        run: |
          scripts/go-docker.sh go build -tags production,smoke -o bin/smoke/ad-manager-desktop .
          mkdir -p .cache/smoke-files
          SHOTS=.cache/smoke ADM_SMOKE_DELAY=25 ADM_SMOKE_DIR=$PWD/.cache/smoke-files ADM_PANEL_URL=https://127.0.0.1:18443 \
            ADM_LIVE_PASSWORD_FILE="$RUNNER_TEMP/live/password" scripts/smoke-linux.sh bin/smoke/ad-manager-desktop
      - name: Native smoke (a configured start, signed in on the sign-in screen)
        working-directory: desktop
        run: |
          pin=sha256:$(echo | openssl s_client -connect 127.0.0.1:18443 2>/dev/null | openssl x509 -outform der | sha256sum | cut -c1-64)
          rm -f .cache/smoke-files/*
          SHOTS=.cache/smoke-configured ADM_SMOKE_DELAY=15 ADM_SMOKE_DIR=$PWD/.cache/smoke-files ADM_PANEL_URL=https://127.0.0.1:18443 \
            ADM_PANEL_FINGERPRINT="$pin" ADM_LIVE_PASSWORD_FILE="$RUNNER_TEMP/live/password" \
            scripts/smoke-linux.sh bin/smoke/ad-manager-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-ci-diagnostics-linux
          path: |
            desktop/.cache/smoke*/*.png
            desktop/.cache/smoke*/app.log
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: The SPA in desktop mode
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build:desktop
      - name: Go tests
        working-directory: desktop
        run: go test ./...
      - name: Build, and the smoke without a panel (WebView2 bridge, a binding)
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags production -trimpath -ldflags "-s -w -H windowsgui" -o bin/ad-manager-desktop.exe .
          go build -tags production,smoke -o bin/smoke.exe .
          mkdir -p smoke && export ADM_SMOKE_DIR="$PWD/smoke" ADM_SMOKE_DELAY=10
          timeout 600 bin/smoke.exe --config "$PWD/smoke/desktop.toml" || true
          cat smoke/smoke.log
          grep -q "^SMOKE PASS" smoke/smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-ci-diagnostics-windows
          path: desktop/smoke/smoke.log

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: The SPA in desktop mode
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build:desktop
      - name: Go tests
        working-directory: desktop
        run: go test ./...
      - name: Universal build (arm64 + amd64), the .app, and the smoke without a panel (WKWebView bridge, a binding)
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: |
          version=$(git describe --tags --always)
          for arch in arm64 amd64; do
            GOARCH=$arch go build -tags production -trimpath -ldflags "-s -w -X main.version=$version" -o "bin/darwin-$arch" .
          done
          lipo -create -output bin/ad-manager-desktop bin/darwin-arm64 bin/darwin-amd64
          lipo -info bin/ad-manager-desktop
          packaging/macos/bundle.sh bin/ad-manager-desktop "${version#v}" dist
          go build -tags production,smoke -o bin/smoke .
          mkdir -p smoke && export ADM_SMOKE_DIR="$PWD/smoke" ADM_SMOKE_DELAY=10
          bin/smoke --config "$PWD/smoke/desktop.toml" &
          pid=$!
          for i in $(seq 1 600); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat smoke/smoke.log
          grep -q "^SMOKE PASS" smoke/smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-ci-diagnostics-macos
          path: desktop/smoke/smoke.log
