<text x="40" y="50" font-size="28" font-weight="700" fill="#113058" text-anchor="start">Typical deployment</text>
<text x="40" y="79" font-size="13" fill="#69788b" text-anchor="start">Generic example: example.local · names and addresses are illustrative</text>
<text x="60" y="145" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Company network</text>
<text x="256" y="145" font-size="13" fill="#69788b" text-anchor="start">example.local</text>
<text x="88" y="212" font-size="16" font-weight="700" fill="#113058" text-anchor="start">dc01</text>
<text x="88" y="239" font-size="13" fill="#0e172d" text-anchor="start">Samba AD DC</text>
<text x="88" y="268" font-size="13" fill="#0e172d" text-anchor="start">10.0.0.10</text>
<text x="88" y="288" font-size="13" fill="#69788b" text-anchor="start">example.local</text>
<text x="88" y="392" font-size="16" font-weight="700" fill="#113058" text-anchor="start">dc02</text>
<text x="88" y="419" font-size="13" fill="#0e172d" text-anchor="start">Samba AD DC</text>
<text x="88" y="448" font-size="13" fill="#0e172d" text-anchor="start">10.0.0.11</text>
<text x="88" y="468" font-size="13" fill="#69788b" text-anchor="start">example.local</text>
<text x="508" y="214" font-size="16" font-weight="700" fill="#113058" text-anchor="start">AD Manager panel</text>
<text x="508" y="240" font-size="13" fill="#0e172d" text-anchor="start">can run on dc01</text>
<text x="508" y="264" font-size="13" fill="#0e172d" text-anchor="start">https://dc01:8443</text>
<text x="508" y="288" font-size="13" fill="#0e172d" text-anchor="start">/opt/ad-manager</text>
<text x="508" y="313" font-size="13" font-weight="700" fill="#1d4a7e" text-anchor="start">ad-manager server</text>
<text x="508" y="448" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Redis</text>
<text x="508" y="472" font-size="13" fill="#0e172d" text-anchor="start">on the panel host or dedicated</text>
<text x="508" y="495" font-size="13" fill="#0e172d" text-anchor="start">asynq queue</text>
<text x="818" y="447" font-size="16" font-weight="700" fill="#113058" text-anchor="start">fs01</text>
<text x="818" y="471" font-size="13" fill="#0e172d" text-anchor="start">Samba member</text>
<text x="818" y="494" font-size="13" fill="#0e172d" text-anchor="start">agent :9443</text>
<text x="818" y="516" font-size="13" fill="#0e172d" text-anchor="start">/srv/shares</text>
<text x="818" y="627" font-size="16" font-weight="700" fill="#113058" text-anchor="start">fs02</text>
<text x="818" y="651" font-size="13" fill="#0e172d" text-anchor="start">Samba member</text>
<text x="818" y="674" font-size="13" fill="#0e172d" text-anchor="start">agent :9443</text>
<text x="818" y="696" font-size="13" fill="#0e172d" text-anchor="start">/srv/shares</text>
<text x="88" y="628" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Windows and Linux clients</text>
<text x="88" y="654" font-size="13" fill="#0e172d" text-anchor="start">joined to the domain</text>
<text x="88" y="682" font-size="13" fill="#69788b" text-anchor="start">example.local</text>
<text x="1108" y="180" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Administrators</text>
<text x="1108" y="211" font-size="13" fill="#0e172d" text-anchor="start">Laptop with a browser</text>
<text x="1108" y="238" font-size="13" fill="#0e172d" text-anchor="start">Desktop app</text>
<text x="1108" y="276" font-size="13" fill="#69788b" text-anchor="start">Administrative access</text>
<text x="1108" y="394" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Package and services</text>
<text x="1108" y="427" font-size="13" font-weight="700" fill="#113058" text-anchor="start">/opt/ad-manager</text>
<text x="1126" y="454" font-size="13" fill="#0e172d" text-anchor="start">ad-manager</text>
<text x="1126" y="480" font-size="13" fill="#0e172d" text-anchor="start">config.toml</text>
<text x="1126" y="506" font-size="13" fill="#0e172d" text-anchor="start">tls/</text>
<text x="1126" y="532" font-size="13" fill="#0e172d" text-anchor="start">data/</text>
<text x="1126" y="558" font-size="13" fill="#0e172d" text-anchor="start">logs/</text>
<text x="1126" y="584" font-size="13" fill="#0e172d" text-anchor="start">docs/</text>
<text x="1108" y="637" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Services</text>
<text x="1108" y="667" font-size="13" fill="#0e172d" text-anchor="start">ad-manager.service</text>
<text x="1108" y="693" font-size="13" fill="#0e172d" text-anchor="start">ad-manager-agent.service</text>
<text x="40" y="784" font-size="13" fill="#69788b" text-anchor="start">The panel and the agents can be installed on separate machines; Redis can be shared by the agents. Only the panel reaches the agents' port.</text>
