<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Inter, DejaVu Sans, Arial, sans-serif" stroke-linecap="square" stroke-linejoin="miter" role="img" aria-labelledby="title desc">
<title id="title">Typical deployment</title>
<desc id="desc">Generic example.local network with two Samba AD DC controllers, the panel, Redis, two Samba member servers with the agent, and Windows and Linux clients. Administrators (browser or desktop app) use only the panel, over HTTPS with their session; the panel reaches the agents with a token. The side box shows the package and the services.</desc>
