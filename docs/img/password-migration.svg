<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Password migration — new-domain cutover (read-only DCSync)</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrRead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Operator / panel -->
  <rect x="30" y="70" width="190" height="78" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="125" y="98" text-anchor="middle" font-weight="700" fill="#3730a3">Operator — panel</text>
  <text x="125" y="118" text-anchor="middle" fill="#3730a3">From another AD</text>
  <text x="125" y="135" text-anchor="middle" fill="#3730a3">→ Passwords  (login + password)</text>

  <!-- Server -->
  <rect x="30" y="190" width="190" height="86" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="125" y="216" text-anchor="middle" font-weight="700" fill="#334155">Server (panel API)</text>
  <text x="125" y="236" text-anchor="middle" fill="#334155">/api/import/ad/plan|apply</text>
  <text x="125" y="253" text-anchor="middle" fill="#334155">reads dest domain SID (pin)</text>
  <text x="125" y="270" text-anchor="middle" fill="#334155">audit: password.migrate (counts)</text>

  <!-- DC agent (destination) -->
  <rect x="300" y="150" width="240" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="176" text-anchor="middle" font-weight="700" fill="#065f46">Destination DC — agent</text>
  <text x="420" y="196" text-anchor="middle" fill="#065f46">gate: password_migration (default off)</text>
  <text x="420" y="213" text-anchor="middle" fill="#065f46">pin dest SID · reject source==dest</text>
  <text x="420" y="230" text-anchor="middle" fill="#065f46">skip RID 500/501/502, trust, machine</text>
  <line x1="315" y1="242" x2="525" y2="242" stroke="#10b981" stroke-dasharray="3 3"/>
  <text x="420" y="260" text-anchor="middle" fill="#065f46" font-weight="600">set on local sam.ldb (bypass control)</text>
  <text x="420" y="277" text-anchor="middle" fill="#065f46">unicodePwd (+ Kerberos when salt ok)</text>
  <text x="420" y="292" text-anchor="middle" fill="#065f46">per-user txn · pwdLastSet ≠ 0</text>

  <!-- Source DC -->
  <rect x="640" y="150" width="290" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="785" y="176" text-anchor="middle" font-weight="700" fill="#1e40af">Source DC (production)</text>
  <text x="785" y="198" text-anchor="middle" fill="#1e40af">sealed DRSUAPI GetNCChanges</text>
  <text x="785" y="215" text-anchor="middle" fill="#1e40af">REPL_OBJ (one object) · replica_flags=0</text>
  <text x="785" y="235" text-anchor="middle" font-weight="700" fill="#b91c1c">READ-ONLY</text>
  <text x="785" y="252" text-anchor="middle" fill="#1e40af">no UpdateRefs · no DRS_ADD_REF · no join</text>
  <text x="785" y="274" text-anchor="middle" fill="#1e40af">returns NT hash + Kerberos package</text>
  <text x="785" y="291" text-anchor="middle" fill="#1e40af">(decrypted in agent memory only)</text>

  <!-- arrows -->
  <line x1="125" y1="148" x2="125" y2="190" stroke="#475569" marker-end="url(#arr)"/>
  <line x1="220" y1="233" x2="300" y2="233" stroke="#475569" marker-end="url(#arr)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#475569">forward</text>

  <line x1="540" y1="205" x2="640" y2="205" stroke="#2563eb" marker-end="url(#arrRead)"/>
  <text x="590" y="198" text-anchor="middle" font-size="11" fill="#2563eb">replicate</text>
  <line x1="640" y1="225" x2="540" y2="225" stroke="#2563eb" marker-end="url(#arrRead)"/>
  <text x="590" y="243" text-anchor="middle" font-size="11" fill="#2563eb">hashes (sealed)</text>

  <!-- credential + outcomes -->
  <rect x="30" y="330" width="500" height="54" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="45" y="352" fill="#92400e" font-weight="700">Source credential</text>
  <text x="45" y="370" fill="#92400e">panel form · AD_SOURCE_PASSWORD_FILE (0600) · stdin — never an argument</text>

  <rect x="30" y="398" width="900" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="45" y="420" fill="#334155" font-weight="700">Per-user outcome (with a sanitized reason — never a secret):</text>
  <text x="45" y="440" fill="#166534" font-weight="600">set</text><text x="75" y="440" fill="#334155">NT + Kerberos</text>
  <text x="200" y="440" fill="#a16207" font-weight="600">ntlm_only</text><text x="270" y="440" fill="#334155">NT only (Kerberos rebuilds on next change)</text>
  <text x="610" y="440" fill="#475569" font-weight="600">same</text><text x="650" y="440" fill="#334155">idempotent</text>
  <text x="45" y="460" fill="#475569" font-weight="600">missing</text><text x="100" y="460" fill="#334155">import objects first</text>
  <text x="260" y="460" fill="#475569" font-weight="600">builtin</text><text x="310" y="460" fill="#334155">protected (skipped)</text>
  <text x="470" y="460" fill="#b91c1c" font-weight="600">rejected</text><text x="530" y="460" fill="#334155">Primary:CLEARTEXT</text>
  <text x="700" y="460" fill="#b91c1c" font-weight="600">error</text><text x="740" y="460" fill="#334155">extraction/write failure</text>
</svg>
