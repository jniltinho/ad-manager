<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Inter, DejaVu Sans, Arial, sans-serif" stroke-linecap="square" stroke-linejoin="miter" role="img" aria-labelledby="title desc">
<title id="title">AD Manager architecture</title>
<desc id="desc">Operators use the panel; the CLI and MCP reach the directory directly over LDAPS. The browser and the desktop app use the panel with the operator's session; only the panel reaches the agents, over HTTPS with a token. Redis coordinates the agents' tasks and clients reach the files over SMB.</desc>
