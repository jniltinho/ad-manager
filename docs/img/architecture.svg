<text x="40" y="50" font-size="28" font-weight="700" fill="#113058" text-anchor="start">AD Manager architecture</text>
<text x="40" y="79" font-size="13" fill="#69788b" text-anchor="start">System components and the directory and share administration flows</text>
<text x="40" y="137" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Operators</text>
<text x="58" y="185" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Browser</text>
<text x="58" y="205" font-size="13" fill="#0e172d" text-anchor="start">Web panel</text>
<text x="58" y="272" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Desktop app</text>
<text x="58" y="297" font-size="13" fill="#0e172d" text-anchor="start">Linux / Windows / macOS</text>
<text x="58" y="376" font-size="16" font-weight="700" fill="#113058" text-anchor="start">CLI</text>
<text x="58" y="397" font-size="13" fill="#0e172d" text-anchor="start">Terminal administration</text>
<text x="58" y="461" font-size="16" font-weight="700" fill="#113058" text-anchor="start">AI agent (MCP)</text>
<text x="58" y="482" font-size="13" fill="#0e172d" text-anchor="start">Directory tools</text>
<text x="532" y="185" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Panel server</text>
<text x="532" y="208" font-size="13" font-weight="700" fill="#1d4a7e" text-anchor="start">ad-manager server</text>
<text x="548" y="255" font-size="16" font-weight="700" fill="#113058" text-anchor="start">REST API + SPA (Vue)</text>
<text x="548" y="273" font-size="13" fill="#0e172d" text-anchor="start">Web UI and administration</text>
<text x="548" y="324" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Sessions (operator account)</text>
<text x="548" y="374" font-size="16" font-weight="700" fill="#113058" text-anchor="start">SQLite</text>
<text x="548" y="393" font-size="13" fill="#0e172d" text-anchor="start">settings, servers and profiles</text>
<text x="548" y="437" font-size="16" font-weight="700" fill="#113058" text-anchor="start">audit.log</text>
<text x="548" y="455" font-size="13" fill="#0e172d" text-anchor="start">Audit trail</text>
<text x="738" y="437" font-size="16" font-weight="700" fill="#113058" text-anchor="start">asynqmon</text>
<text x="738" y="455" font-size="13" fill="#0e172d" text-anchor="start">/asynqmon</text>
<text x="1118" y="184" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Domain controller</text>
<text x="1118" y="208" font-size="13" fill="#0e172d" text-anchor="start">(Windows or Samba)</text>
<text x="1118" y="235" font-size="13" fill="#0e172d" text-anchor="start">dc01 · example.local</text>
<text x="1118" y="266" font-size="13" fill="#69788b" text-anchor="start">Identity and directory</text>
<text x="518" y="612" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Redis (asynq queue)</text>
<text x="518" y="638" font-size="13" fill="#0e172d" text-anchor="start">Tasks and retries</text>
<text x="518" y="659" font-size="13" fill="#0e172d" text-anchor="start">Background execution</text>
<text x="848" y="580" font-size="16" font-weight="700" fill="#113058" text-anchor="start">File server</text>
<text x="848" y="601" font-size="13" fill="#0e172d" text-anchor="start">(Samba member)</text>
<text x="848" y="622" font-size="13" font-weight="700" fill="#1d4a7e" text-anchor="start">fs01 — ad-manager agent</text>
<text x="848" y="646" font-size="13" fill="#0e172d" text-anchor="start">net conf · POSIX ACL</text>
<text x="848" y="666" font-size="13" fill="#0e172d" text-anchor="start">/srv/shares · Samba logs</text>
<text x="1128" y="580" font-size="16" font-weight="700" fill="#113058" text-anchor="start">File server</text>
<text x="1128" y="601" font-size="13" fill="#0e172d" text-anchor="start">(Samba member)</text>
<text x="1128" y="622" font-size="13" font-weight="700" fill="#1d4a7e" text-anchor="start">fs02 — ad-manager agent</text>
<text x="1128" y="646" font-size="13" fill="#0e172d" text-anchor="start">net conf · POSIX ACL</text>
<text x="1128" y="666" font-size="13" fill="#0e172d" text-anchor="start">/srv/shares · Samba logs</text>
<text x="78" y="637" font-size="16" font-weight="700" fill="#113058" text-anchor="start">Windows / Linux clients</text>
<text x="78" y="661" font-size="13" fill="#0e172d" text-anchor="start">Share access</text>
<text x="40" y="784" font-size="13" fill="#69788b" text-anchor="start">No service account: every action uses the credentials of the person operating.</text>
